site_name: DMC Lite Shield Manual
site_url: https://dmclite.github.io/dmc-lite-shield-docs
site_description: Customer manual and documentation for the DMC Lite Shield - Arduino Giga R1 motion control shield for Dragonframe
site_author: DMC Lite
repo_url: https://github.com/dmclite/dmc-lite-shield-docs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
      - What's in the Box: getting-started/whats-in-the-box.md
      - Prerequisites: getting-started/prerequisites.md
  - Hardware:
      - Specifications: hardware/specifications.md
      - Wiring & Connections: hardware/wiring.md
  - Setup:
      - Installing Firmware: setup/firmware.md
      - Dragonframe Configuration: setup/dragonframe.md
      - E-Stop Setup: setup/estop.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Support: support.md

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://www.dmclite.com
