<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img"><title>How the system connects</title><desc>The shield controls external drivers. It does not drive motor windings.</desc><rect width="1400" height="680" fill="#fff"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#14243b" text-anchor="start">How the system connects</text><text x="40" y="90" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#516176" text-anchor="start">The shield controls external drivers. It does not drive motor windings.</text><rect x="40" y="175" width="280" height="150" rx="12" fill="#edf3fc" stroke="none" stroke-width="3"/><text x="180.0" y="230" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#14243b" text-anchor="middle">Computer</text><text x="180.0" y="276" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#14243b" text-anchor="middle">Dragonframe</text><rect x="440" y="175" width="360" height="150" rx="12" fill="#edf3fc" stroke="none" stroke-width="3"/><text x="620.0" y="230" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#14243b" text-anchor="middle">GIGA + shield</text><text x="620.0" y="276" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#14243b" text-anchor="middle">dmc-lite firmware</text><rect x="930" y="175" width="420" height="150" rx="12" fill="#edf3fc" stroke="none" stroke-width="3"/><text x="1140.0" y="230" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#14243b" text-anchor="middle">External motor driver</text><text x="1140.0" y="276" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#14243b" text-anchor="middle">One per axis</text><path d="M320,250 L440,250" stroke="#245bcc" stroke-width="3" fill="none"/><text x="345" y="220" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#14243b" text-anchor="start">USB</text><path d="M800,250 L930,250" stroke="#245bcc" stroke-width="3" fill="none"/><text x="811" y="210" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#14243b" text-anchor="start">STEP / DIR</text><rect x="930" y="435" width="420" height="120" rx="12" fill="#e6f5f0" stroke="none" stroke-width="3"/><text x="1140" y="478" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#14243b" text-anchor="middle">Motor</text><text x="1140" y="518" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#14243b" text-anchor="middle">Driver supplies winding current</text><path d="M1140,325 L1140,435" stroke="#087f8c" stroke-width="3" fill="none"/><text x="1160" y="386" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#14243b" text-anchor="start">Motor cable</text><rect x="40" y="435" width="760" height="120" rx="12" fill="#fff3df" stroke="none" stroke-width="3"/><text x="65" y="479" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#14243b" text-anchor="start">Separate motor power supply</text><text x="65" y="520" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">Connect to the external driver, per its manual.</text><path d="M800,495 L865,495" stroke="#a55300" stroke-width="3" fill="none"/><path d="M865,495 L865,300" stroke="#a55300" stroke-width="3" fill="none"/><path d="M865,300 L930,300" stroke="#a55300" stroke-width="3" fill="none"/><text x="40" y="656" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#516176" text-anchor="start">Conceptual system diagram • Check receiver input requirements before connecting RJ45 or DB37.</text></svg>
