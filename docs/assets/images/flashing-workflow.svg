<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img"><title>Flash BOTH Arduino cores</title><desc>Use the matching dmc_m7 and dmc_m4 folders supplied with your Dragonframe installation.</desc><rect width="1400" height="790" fill="#fff"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#14243b" text-anchor="start">Flash BOTH Arduino cores</text><text x="40" y="90" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#516176" text-anchor="start">Use the matching dmc_m7 and dmc_m4 folders supplied with your Dragonframe installation.</text><rect x="40" y="140" width="1320" height="120" rx="12" fill="#edf3fc" stroke="none" stroke-width="3"/><text x="65" y="181" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#14243b" text-anchor="start">Find the sketches</text><text x="65" y="222" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#14243b" text-anchor="start">Dragonframe installation → Resources → Arc Motion Control → dmc</text><rect x="40" y="295" width="640" height="164" rx="12" fill="#edf3fc" stroke="none" stroke-width="3"/><circle cx="68" cy="324" r="17" fill="#245bcc" stroke="white" stroke-width="3"/><text x="68" y="330" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">1</text><text x="97" y="331" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#14243b" text-anchor="start">Main core: M7</text><text x="97" y="360" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#516176" text-anchor="start">Open dmc_m7/dmc_m7.ino</text><text x="97" y="386" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#516176" text-anchor="start">Target core: Main core</text><text x="97" y="412" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#516176" text-anchor="start">Flash split: 1.5MB M7 + 0.5MB M4</text><text x="97" y="438" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#516176" text-anchor="start">Click Upload; wait for success.</text><rect x="720" y="295" width="640" height="164" rx="12" fill="#edf3fc" stroke="none" stroke-width="3"/><circle cx="748" cy="324" r="17" fill="#245bcc" stroke="white" stroke-width="3"/><text x="748" y="330" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">2</text><text x="777" y="331" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#14243b" text-anchor="start">Co-processor: M4</text><text x="777" y="360" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#516176" text-anchor="start">Open dmc_m4/dmc_m4.ino</text><text x="777" y="386" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#516176" text-anchor="start">Target core: M4 Co-processor</text><text x="777" y="412" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#516176" text-anchor="start">Same flash split as M7</text><text x="777" y="438" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#516176" text-anchor="start">Click Upload; wait for success.</text><rect x="40" y="520" width="1320" height="150" rx="12" fill="#edf3fc" stroke="none" stroke-width="3"/><text x="65" y="561" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#14243b" text-anchor="start">Then connect Dragonframe</text><text x="65" y="603" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#14243b" text-anchor="start">Scene → Connections → Add Connection → dmc-lite</text><text x="65" y="640" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">Select an ArcMoco slot and the GIGA USB port. Connect and test one axis.</text><text x="40" y="766" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#516176" text-anchor="start">Instruction diagram, not an IDE screenshot • Verify compiles only; Upload writes the firmware.</text></svg>
