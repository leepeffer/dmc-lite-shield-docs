<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img"><title>Three ways to connect J5</title><desc>Conceptual wiring • Locate numbered terminals using the J5 close-up • Power off before wiring.</desc><rect width="1400" height="1050" fill="#fff"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#14243b" text-anchor="start">Three ways to connect J5</text><text x="40" y="90" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#516176" text-anchor="start">Conceptual wiring • Locate numbered terminals using the J5 close-up • Power off before wiring.</text><rect x="40" y="145" width="1320" height="245" rx="12" fill="#edf3fc" stroke="none" stroke-width="3"/><text x="65" y="183" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#14243b" text-anchor="start">A · Button requests a Dragonframe action</text><text x="65" y="239" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">J5 SWITCH · pin 5</text><text x="65" y="302" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">J5 GND · pin 1 or 7</text><path d="M370,232 L785,232" stroke="#245bcc" stroke-width="3" fill="none"/><path d="M370,295 L785,295" stroke="#245bcc" stroke-width="3" fill="none"/><rect x="785" y="207" width="525" height="112" rx="12" fill="white" stroke="#087f8c" stroke-width="3"/><text x="810" y="243" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#14243b" text-anchor="start">Normally open pushbutton</text><text x="810" y="285" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#14243b" text-anchor="start">Press connects SWITCH to GND.</text><text x="65" y="359" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">Enable D49 in M7 firmware; assign Shoot in Scene → Triggers.</text><rect x="40" y="425" width="1320" height="245" rx="12" fill="#edf3fc" stroke="none" stroke-width="3"/><text x="65" y="463" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#14243b" text-anchor="start">B · Relay closes a receiver’s contact input</text><text x="65" y="519" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">J5 RELAY+ · pin 3</text><text x="65" y="582" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">J5 RELAY− · pin 4</text><path d="M370,512 L785,512" stroke="#245bcc" stroke-width="3" fill="none"/><path d="M370,575 L785,575" stroke="#245bcc" stroke-width="3" fill="none"/><rect x="785" y="487" width="525" height="112" rx="12" fill="white" stroke="#087f8c" stroke-width="3"/><text x="810" y="523" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#14243b" text-anchor="start">Receiver dry-contact input</text><text x="810" y="565" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#14243b" text-anchor="start">Connect across its two input terminals.</text><text x="65" y="639" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#14243b" text-anchor="start">LOG1 controls relay. Floating contacts; no voltage supplied. Low-voltage control use only.</text><rect x="40" y="705" width="1320" height="245" rx="12" fill="#edf3fc" stroke="none" stroke-width="3"/><text x="65" y="743" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#14243b" text-anchor="start">C · LOG2 drives a logic-trigger input</text><text x="65" y="799" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">J5 LOGIC · pin 2</text><text x="65" y="862" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">J5 GND · pin 1 or 7</text><path d="M370,792 L785,792" stroke="#245bcc" stroke-width="3" fill="none"/><path d="M370,855 L785,855" stroke="#245bcc" stroke-width="3" fill="none"/><rect x="785" y="767" width="525" height="112" rx="12" fill="white" stroke="#087f8c" stroke-width="3"/><text x="810" y="803" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#14243b" text-anchor="start">Compatible logic receiver</text><text x="810" y="845" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#14243b" text-anchor="start">Top wire: signal. Bottom: common.</text><text x="65" y="919" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#14243b" text-anchor="start">Nominal 5 V stage, with 1 kΩ series resistor. Verify input thresholds and loading.</text><text x="40" y="1026" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#516176" text-anchor="start">Wiring blocks show functions, not internal circuitry. Never connect a lamp or motor directly to LOG2.</text></svg>
