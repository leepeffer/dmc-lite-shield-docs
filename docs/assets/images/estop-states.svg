<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730" role="img"><title>E-stop: match wiring and firmware</title><desc>J5 pin 6 → stop contact → J5 GND (pin 1 or 7). The contact must not apply an external voltage.</desc><rect width="1400" height="730" fill="#fff"/><text x="40" y="54" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#14243b" text-anchor="start">E-stop: match wiring and firmware</text><text x="40" y="90" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#516176" text-anchor="start">J5 pin 6 → stop contact → J5 GND (pin 1 or 7). The contact must not apply an external voltage.</text><rect x="40" y="140" width="640" height="405" rx="12" fill="#edf3fc" stroke="none" stroke-width="3"/><text x="65" y="185" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#14243b" text-anchor="start">Normally open (NO)</text><text x="65" y="245" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#14243b" text-anchor="start">Released</text><text x="310" y="245" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#087f8c" text-anchor="start">OPEN</text><text x="65" y="279" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">No stop request</text><text x="65" y="340" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#14243b" text-anchor="start">Pressed</text><text x="310" y="340" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#087f8c" text-anchor="start">CLOSED</text><text x="65" y="374" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">Stop requested</text><text x="65" y="435" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#14243b" text-anchor="start">Broken wire</text><text x="310" y="435" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#087f8c" text-anchor="start">OPEN</text><text x="65" y="469" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">Not detected as a stop</text><rect x="720" y="140" width="640" height="405" rx="12" fill="#edf3fc" stroke="none" stroke-width="3"/><text x="745" y="185" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#14243b" text-anchor="start">Normally closed (NC)</text><text x="745" y="245" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#14243b" text-anchor="start">Released</text><text x="990" y="245" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#087f8c" text-anchor="start">CLOSED</text><text x="745" y="279" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">No stop request</text><text x="745" y="340" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#14243b" text-anchor="start">Pressed</text><text x="990" y="340" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#087f8c" text-anchor="start">OPEN</text><text x="745" y="374" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">Stop requested</text><text x="745" y="435" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#14243b" text-anchor="start">Broken wire</text><text x="990" y="435" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#087f8c" text-anchor="start">OPEN</text><text x="745" y="469" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#14243b" text-anchor="start">Stop requested</text><rect x="40" y="575" width="1320" height="85" rx="12" fill="#fff3df" stroke="none" stroke-width="3"/><text x="65" y="608" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#14243b" text-anchor="start">Enable D48. NC operation also requires firmware that implements NC mode.</text><text x="65" y="641" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#14243b" text-anchor="start">Red LED = grounded input. This input requests a firmware stop; it does not cut motor power.</text><text x="40" y="706" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#516176" text-anchor="start">Test released, pressed and disconnected states before motion. This is not a safety-rated stop circuit.</text></svg>
